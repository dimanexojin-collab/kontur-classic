name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# По умолчанию только чтение; нужные права выдаются отдельным задачам ниже.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Репозиторий должен называться <owner>.github.io, тогда сайт в корне домена.
      SITE: https://${{ github.repository_owner }}.github.io
    steps:
      # Версии закреплены по отпечатку коммита (защита от подмены метки). Обновляет Dependabot.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/archive-pages.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

